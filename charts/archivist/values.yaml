  #   command:
  #     - sh
  #     - -c
  #     - |
  #         echo "clean-up datadir"
  #         rm -rf {{ .Values.archivist.env.ARCHIVIST_DATA_DIR }}/*
  #   volumeMounts:
  #     - name: '{{ .Values.persistence.name }}'
  #       mountPath: '{{ .Values.archivist.env.ARCHIVIST_DATA_DIR }}'

# Additional
extraContainers: []
# - name: extra
#   image: busybox:latest
#   command: ['sh', '-c', 'echo "hello"']

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

terminationGracePeriodSeconds: 120

podDisruptionBudget: {}
  # maxUnavailable: 1
  # minAvailable: 1
